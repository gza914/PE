<title>Consigliere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@500;700&family=Courier+Prime:wght@400;700&family=Libre+Franklin:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a desk seen from above. A sticky masthead carries the month, your standing and the one
   action that moves time. Below it the Office splits in two: matters on your desk (left, wide) and
   last month's typed report (right). Narrow windows stack the two. */
:root {
  --paper: #e7ece0;      /* columnar ledger paper */
  --sheet: #f6f8f1;      /* a typed sheet on the desk */
  --ink: #1c261f;
  --muted: #59685d;
  --rule: #c3cfb9;
  --brass: #7a5c14;      /* accent: the Don's office fittings */
  --brass-soft: #e5dbbd;
  --danger: #982828;     /* red is reserved for danger */
  --good: #2f6a3e;
  --on-brass: #fbf8ef;
  --display: "Antonio", "Arial Narrow", "Helvetica Neue Condensed", Impact, sans-serif;
  --body: "Libre Franklin", "Franklin Gothic", "Helvetica Neue", Arial, sans-serif;
  --typed: "Courier Prime", "Courier New", Courier, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111712; --sheet: #182019; --ink: #e2e8da; --muted: #95a497; --rule: #2d3b30;
    --brass: #d0aa4d; --brass-soft: #3a3320; --danger: #e3786c; --good: #8fc59b; --on-brass: #17140a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111712; --sheet: #182019; --ink: #e2e8da; --muted: #95a497; --rule: #2d3b30;
  --brass: #d0aa4d; --brass-soft: #3a3320; --danger: #e3786c; --good: #8fc59b; --on-brass: #17140a; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); }
.wrap { max-width: 80rem; margin: 0 auto; padding-inline: 24px; }
@media (max-width: 640px) { .wrap { padding-inline: 16px; } }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

/* Masthead */
.mast { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 2px solid var(--ink); }
.mast-grid { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px 32px; align-items: end; padding-block: 14px 12px; }
@media (max-width: 900px) { .mast-grid { grid-template-columns: minmax(0, 1fr) auto; } .meters { grid-column: 1 / -1; order: 3; } }
.brand { font: 700 0.78rem/1 var(--display); letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); }
.month { font: 700 clamp(1.8rem, 3.4vw, 2.5rem)/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; margin: 6px 0 0; white-space: nowrap; }
.meters { display: grid; grid-template-columns: minmax(0, 1.35fr) repeat(5, minmax(0, 1fr)); gap: 12px; min-width: 0; }
@media (max-width: 640px) { .meters { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 14px; } }
.meter { min-width: 0; display: grid; gap: 3px; align-content: end; }
.meter .label { font-size: 0.64rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter b { font: 700 1rem/1.1 var(--typed); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter.word b { font: 600 0.95rem/1.1 var(--body); }
.bar { height: 5px; background: var(--rule); }
.bar i { display: block; height: 100%; background: var(--ink); }
.meter.warn b { color: var(--danger); }
.meter.warn .bar i { background: var(--danger); }
.end-month {
  display: inline-flex; flex-direction: column; align-items: flex-start; gap: 3px;
  background: var(--brass); color: var(--on-brass); border: 0; padding: 11px 18px; cursor: pointer;
  box-shadow: 0 2px 0 var(--ink); white-space: nowrap;
}
.end-month b { font: 700 1.05rem/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; }
.end-month span { font: 0.78rem/1 var(--typed); opacity: 0.9; }
.end-month:hover { filter: brightness(1.06); }
.end-month:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--ink); }

.tabs { display: flex; gap: 28px; padding-block: 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
@media (max-width: 640px) { .tabs { gap: 18px; } }
.tabs button {
  background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 0 8px; cursor: pointer; flex: none;
  font: 500 0.95rem/1 var(--display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brass); }
.tabs button:hover { color: var(--ink); }
.tabs .count { font: 700 0.75rem var(--typed); letter-spacing: 0; color: var(--brass); margin-left: 4px; }

main { padding-block: 26px 64px; }
.office { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 960px) { .office { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 18px; min-width: 0; }
.col-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1.5px solid var(--ink); padding-bottom: 6px; }
.col-head h2 { font: 700 1.05rem/1 var(--display); letter-spacing: 0.16em; text-transform: uppercase; margin: 0; }
.col-head small { font: 0.8rem var(--typed); color: var(--muted); }

/* Matters */
.matter { background: var(--sheet); border: 1px solid var(--rule); padding: 20px 22px 18px; display: grid; gap: 12px; }
.matter h3 { font: 700 1.45rem/1.15 var(--display); letter-spacing: 0.02em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.matter .body p { margin: 0 0 10px; max-width: 66ch; }
.matter .body p:last-child { margin-bottom: 0; }
.matter .waited { font: 0.8rem var(--typed); color: var(--brass); }
.choices { display: grid; gap: 6px; margin-top: 4px; }
.choice {
  display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left;
  background: transparent; border: 1px solid var(--rule); padding: 9px 12px; cursor: pointer; line-height: 1.35;
}
.choice:hover { border-color: var(--ink); }
.choice .box { width: 16px; height: 16px; border: 1.5px solid var(--ink); margin-top: 2px; display: grid; place-items: center; }
.choice[aria-pressed="true"] { border-color: var(--brass); background: var(--brass-soft); }
.choice[aria-pressed="true"] .box::after { content: ""; width: 8px; height: 8px; background: var(--ink); }
.choice.aside { color: var(--muted); font-size: 0.92rem; }
.choice-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.choice-row:has(> :only-child) { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 520px) { .choice-row { grid-template-columns: minmax(0, 1fr); } }
.advice-status { font: 0.82rem var(--typed); color: var(--muted); }
.advice-status b { color: var(--ink); }

/* Intel: slips of paper from your sources */
.intel { display: grid; gap: 10px; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); padding-block: 12px; }
.intel-head { font: 700 0.72rem/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--brass); }
.intel-item { display: grid; gap: 6px; }
.slips { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.slip { background: var(--paper); border: 1px solid var(--rule); padding: 8px 12px; display: grid; gap: 3px; }
.slip-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; font: 0.8rem var(--typed); }
.src { font-weight: 700; }
.says { font-style: italic; }
.trust { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
.trust-bar { display: inline-block; width: 44px; height: 5px; background: var(--rule); }
.trust-bar i { display: block; height: 100%; background: var(--brass); }
.intel-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.split { font: 700 0.75rem var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--danger); }
.verify { background: transparent; border: 1px solid var(--brass); color: var(--brass); padding: 5px 10px; font: 600 0.8rem var(--body); cursor: pointer; }
.verify:hover:not(:disabled) { background: var(--brass-soft); }
.verify:disabled { border-color: var(--rule); color: var(--muted); cursor: not-allowed; }
.revealed { font: 0.8rem var(--typed); color: var(--ink); border-left: 2px solid var(--brass); padding-left: 8px; margin-top: 4px; }

/* Sit-down */
.sitdown { background: var(--sheet); border: 1.5px solid var(--ink); padding: 18px 22px; display: grid; gap: 12px; }
.sitdown .kicker { font: 700 0.72rem var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--brass); }
.sitdown h3 { font: 700 1.45rem/1.15 var(--display); text-transform: uppercase; letter-spacing: 0.02em; margin: 0; }
.terms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.terms > div { display: grid; gap: 2px; border-top: 1.5px solid var(--ink); padding-top: 6px; min-width: 0; }
.terms .label { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.terms b { font: 700 1.25rem/1.1 var(--typed); }
.terms b.warn { color: var(--danger); }
.terms small { font: 0.75rem var(--typed); color: var(--muted); }
.table-log { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; font-style: italic; }
.table-moves { display: flex; flex-wrap: wrap; gap: 8px; }
.move { background: var(--ink); color: var(--paper); border: 1.5px solid var(--ink); padding: 8px 14px; font: 600 0.88rem var(--body); cursor: pointer; }
.move:hover { filter: brightness(1.2); }
.move.quiet-move { background: transparent; color: var(--danger); border-color: var(--danger); }

/* City */
.houses { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: 16px; }
.house { background: var(--sheet); border: 1px solid var(--rule); padding: 16px 18px; display: grid; gap: 10px; align-content: start; }
.house.ours { border-left: 4px double var(--brass); }
.house h3 { font: 700 1.25rem/1.1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; margin: 0; }
.house-line { font: 0.85rem var(--typed); color: var(--muted); }
.districts { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font: 0.88rem var(--typed); }
.districts li { display: flex; justify-content: space-between; gap: 8px; }
.heat-chip { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.ladder { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 3px; }
.ladder li { font: 600 0.66rem var(--body); letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 6px; border: 1px solid var(--rule); color: var(--muted); }
.ladder li.past { background: var(--brass-soft); color: var(--ink); }
.ladder li.now { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ladder li.now.war { background: var(--danger); border-color: var(--danger); color: var(--sheet); }
.law { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.law > li { background: var(--sheet); border: 1px solid var(--rule); padding: 10px 14px; display: grid; gap: 6px; }
.law small { font: 0.75rem var(--typed); color: var(--muted); }
.law-flag { font: 700 0.72rem var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--danger); }
.person.gone { opacity: 0.55; }

/* Your own decisions, and the end */
.matter.yours { border: 1.5px solid var(--brass); }
.matter .kicker, .memoir .kicker { font: 700 0.72rem var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--brass); }
.end-month:disabled { filter: grayscale(1); opacity: 0.6; cursor: default; }
.memoir { background: var(--sheet); border: 1px solid var(--rule); border-left: 4px double var(--brass); padding: 28px 32px; display: grid; gap: 14px; max-width: 60rem; }
.memoir h2 { font: 700 clamp(2rem, 4vw, 3rem)/1.05 var(--display); text-transform: uppercase; letter-spacing: 0.02em; margin: 0; text-wrap: balance; }
.memoir .rank { font: 0.85rem var(--typed); color: var(--muted); }
.memoir-text { font-size: 1.1rem; max-width: 62ch; }
.memoir-text p { margin: 0 0 10px; }
.memoir-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
@media (max-width: 760px) { .memoir-grid { grid-template-columns: minmax(0, 1fr); } .memoir { padding: 20px; } }

/* Dossiers */
.dossiers { display: grid; grid-template-columns: minmax(14rem, 18rem) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .dossiers { grid-template-columns: minmax(0, 1fr); } }
.dossier-list ul { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 2px; }
.dossier-pick { width: 100%; text-align: left; background: transparent; border: 0; border-left: 3px solid transparent; padding: 7px 10px; cursor: pointer; display: grid; }
.dossier-pick small { font: 0.74rem var(--typed); color: var(--muted); }
.dossier-pick:hover { background: var(--sheet); }
.dossier-pick.on { background: var(--sheet); border-left-color: var(--brass); font-weight: 600; }
.dossier-pick.gone span { text-decoration: line-through; color: var(--muted); }
.dossier { display: grid; gap: 8px; }
.dossier-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; flex-wrap: wrap; }
.dossier h2 { font-size: 1.8rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 0.72rem var(--body); letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid var(--ink); padding: 3px 8px; }
.belief { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.note-text { width: 100%; font: 0.95rem var(--typed); background: var(--paper); color: var(--ink); border: 1px solid var(--rule); padding: 10px; resize: vertical; }
.note-text:focus-visible { outline: 3px solid var(--brass); outline-offset: 1px; }
.pin[aria-pressed="true"] { background: var(--brass-soft); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Ledger and moves */
table.expect td small { display: block; font-size: 0.72rem; color: var(--muted); white-space: normal; }
table.expect td:last-child { text-align: right; }
.earn { font: 0.82rem var(--typed); color: var(--muted); }
.moves { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.moves li { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--sheet); border: 1px solid var(--rule); padding: 8px 14px; }
.moves li > span:first-child { display: grid; }
.moves small { font: 0.75rem var(--typed); color: var(--muted); }
.move-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.move-form select { font: 0.88rem var(--body); padding: 5px 8px; background: var(--paper); color: var(--ink); border: 1px solid var(--rule); }

/* Sources */
.lede { max-width: 70ch; }
.source { background: var(--sheet); border: 1px solid var(--rule); padding: 16px 18px; display: grid; gap: 6px; align-content: start; }
.source h3 { font: 700 1.2rem/1.15 var(--display); letter-spacing: 0.03em; text-transform: uppercase; margin: 0; }
.source.gone { opacity: 0.6; }
.trust-big { display: flex; align-items: center; gap: 8px; font: 0.9rem var(--typed); }
.trust-big .trust-bar { width: 90px; height: 7px; }
.record, .first { font: 0.82rem var(--typed); color: var(--muted); }

.news { border-left: 4px solid var(--danger); background: var(--sheet); padding: 14px 18px; }
.news .kicker { font: 700 0.72rem var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--danger); }
.news h3 { font: 700 1.2rem/1.2 var(--display); text-transform: uppercase; letter-spacing: 0.03em; margin: 4px 0 6px; }
.news p { margin: 0 0 8px; }
.news p:last-child { margin: 0; }
.empty { color: var(--muted); font-style: italic; }

/* Typed report */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-left: 4px double var(--rule); padding: 18px 20px 20px; min-width: 0; }
.sheet h2 { font: 700 1.3rem/1.2 var(--display); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 2px; }
.stamp { font: 0.78rem var(--typed); color: var(--muted); margin: 0 0 12px; }
.section-head { font: 700 0.74rem/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--brass); margin: 18px 0 8px; }
.rows { display: grid; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding-block: 3px; font: 0.92rem var(--typed); }
.row .who { min-width: 0; }
.row .who small { display: block; font-size: 0.76rem; color: var(--muted); }
.row .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.total { border-top: 1.5px solid var(--ink); margin-top: 4px; font-weight: 700; }
.row.unpaid .num, .num.neg { color: var(--danger); }
.row.unpaid .num { font-weight: 700; }
.net { font: 700 0.95rem var(--typed); margin-top: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.delta.down { color: var(--danger); }

.decisions { display: grid; gap: 14px; }
.decision { display: grid; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
.decision:last-child { border-bottom: 0; padding-bottom: 0; }
.decision-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.decision h4 { margin: 0; font: 600 0.98rem/1.3 var(--body); }
.tone { font: 700 0.72rem var(--body); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
.tone.good { color: var(--good); } .tone.bad { color: var(--danger); } .tone.neutral, .tone.waiting { color: var(--muted); }
.decision .what { font: 0.82rem var(--typed); color: var(--muted); }
.decision .what b { color: var(--ink); font-weight: 700; }
.decision p { margin: 0; font-style: italic; }
.notes { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.note { font-style: italic; }
.note .meta { display: block; font: normal 0.74rem var(--typed); color: var(--muted); margin-top: 2px; }
.quiet { color: var(--muted); font-size: 0.92rem; margin: 0; }
.memo p { margin: 0 0 12px; max-width: 62ch; }

/* Family */
.family { display: grid; gap: 22px; }
.don-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: end; }
.don-card h2 { font: 700 2rem/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; margin: 0; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 16px; }
.person { background: var(--sheet); border: 1px solid var(--rule); padding: 16px 18px; display: grid; gap: 8px; align-content: start; }
.person h3 { font: 700 1.25rem/1.1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; margin: 0; }
.role { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.reading { display: inline-flex; align-items: center; gap: 8px; font: 0.85rem var(--typed); }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 9px; height: 9px; border: 1.5px solid var(--ink); display: block; }
.pips i.on { background: var(--ink); }
.reading.low .pips i { border-color: var(--danger); }
.reading.low .pips i.on { background: var(--danger); }
.reading.low span { color: var(--danger); }
.rackets { margin: 0; padding: 0; list-style: none; font: 0.88rem var(--typed); }
.rackets li::before { content: "· "; color: var(--muted); }
.lastnote { font-style: italic; font-size: 0.9rem; color: var(--muted); }

/* Books */
.books { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 960px) { .books { grid-template-columns: minmax(0, 1fr); } }
.chart { width: 100%; height: auto; display: block; margin-bottom: 10px; }
.chart .line { fill: none; stroke: var(--ink); stroke-width: 2; }
.chart .area { fill: var(--brass-soft); }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart text { fill: var(--muted); font: 11px var(--typed); }
.chart .end { fill: var(--brass); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font: 0.88rem var(--typed); font-variant-numeric: tabular-nums; }
th { text-align: right; font: 700 0.7rem var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 6px 0 6px 12px; border-bottom: 1.5px solid var(--ink); }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
td { text-align: right; padding: 5px 0 5px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td.flag { color: var(--danger); font-weight: 700; }
.game-meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; font: 0.82rem var(--typed); color: var(--muted); margin-top: 18px; }
.btn-quiet { background: transparent; border: 1.5px solid var(--ink); padding: 7px 14px; font: 600 0.85rem var(--body); cursor: pointer; }
.btn-danger { background: var(--danger); border: 1.5px solid var(--danger); color: var(--sheet); padding: 7px 14px; font: 600 0.85rem var(--body); cursor: pointer; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
