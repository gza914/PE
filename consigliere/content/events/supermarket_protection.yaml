id: supermarket_protection
title: The new supermarket
text: |-
  A chain called Hollis Brothers has opened a supermarket in {district}, the biggest in the city. The manager, a young man from Ohio, has refused to pay {capo}'s collectors. He says he has never heard of the family.

  Every small grocer in {district} is watching to see what happens.
cast:
  district:
    district_of: family
  capo:
    role: [capo]
cooldown: 24
options:
  - id: teach
    label: Teach him who the family is
    don: {base: 0, paranoid: 1}
    outcomes:
      - weight: 2
        tone: good
        text: The supermarket's delivery trucks have a run of flat tires and spoiled loads. The young man from Ohio learns quickly, and pays.
        effects:
          - treasury: 3000
          - stat: {who: capo, stat: fear, delta: 4}
      - weight: 1
        tone: bad
        text: Hollis Brothers has lawyers, and lawyers have friends at the district attorney's office.
        headline: "Supermarket Chain Charges Extortion Attempt"
        effects:
          - heat: {who: family, delta: 8}
  - id: deal
    label: Offer him a deal on deliveries instead of protection
    don: {base: 0.5, cautious: 1}
    outcomes:
      - tone: good
        text: The family's trucking company gets the supermarket's deliveries at a fair price. The young man from Ohio thinks he has made a very good deal.
        effects:
          - treasury: 2000
  - id: let_go
    label: Let one store go
    don: {base: 0, sentimental: 0.5}
    outcomes:
      - tone: bad
        text: One store goes free. Within a month, four small grocers have stopped paying too.
        effects:
          - stat: {who: capo, stat: respect, delta: -5}
          - treasury: -2000
