id: old_enemy_funeral
title: A funeral across the river
text: |-
  Old Pasquale Brancato, {boss}'s uncle, is being buried on Saturday. Forty years ago he shot at the Don, and missed. They have not spoken since.

  The question is whether the Don goes to the funeral.
cast:
  rival:
    rival: true
    where: [[self.stage, "<", 5]]
  boss:
    boss_of: rival
once: true
trigger: [[month, ">=", 15]]
options:
  - id: go
    label: The Don goes, and pays his respects
    don: {base: 0.5, sentimental: 1, pious: 1}
    outcomes:
      - tone: good
        text: The Don goes, kneels, and kisses {boss} on both cheeks. Forty years of history are buried with the old man, or at least some of it.
        effects:
          - rivalry: {who: rival, tension: -15}
          - standing: {influence: 2}
  - id: flowers
    label: Send flowers, and stay home
    don: {base: 0.5, cautious: 1}
    outcomes:
      - tone: neutral
        text: The flowers are very large. {boss} notices them, and notices who did not come with them.
        effects:
          - rivalry: {who: rival, tension: -3}
  - id: nothing
    label: Send nothing
    don: {base: 0, paranoid: 1, vain: 0.5}
    outcomes:
      - tone: bad
        text: Nothing is sent. {boss} stands at the graveside and looks across the river.
        effects:
          - rivalry: {who: rival, tension: 10}
