id: councilman
title: The councilman's campaign
text: |-
  Councilman Walter Hask is running again, and running short. His man came by the social club and didn't ask for anything.

  He only mentioned how expensive printing has become.
trigger: [[treasury, ">", 30000]]
weight: 1.5
cooldown: 12
options:
  - id: give
    label: Five thousand in cash, no paper
    don: {base: 0.5}
    advised_exposure: 2
    outcomes:
      - weight: 3
        tone: good
        text: Hask wins by eleven hundred votes. He sends a Christmas card with no return address.
        effects:
          - treasury: -5000
          - standing: {influence: 6}
      - weight: 1
        tone: bad
        text: Hask loses. The money is gone, and the man who won knows who backed the other fellow.
        effects:
          - treasury: -5000
          - standing: {exposure: 2}
          - don_mood: -3
  - id: decline
    label: Nothing, politely
    don: {base: 0, cautious: 1}
    outcomes:
      - tone: neutral
        text: Hask finds his money elsewhere. He will remember where he didn't find it.
        effects:
          - standing: {influence: -2}
