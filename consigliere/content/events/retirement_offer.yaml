id: retirement_offer
title: A quiet word about the future
text: |-
  You have been at the Don's right hand a long time. Your wife has started leaving brochures for a place by the sea, face up, where you will see them.

  The family is in a good state. It might not always be. A man could leave now, on his own feet.
trigger: [[month, ">=", 72], [dons_trust, ">=", 60], [flag.don_gone, "==", 0]]
weight: 1
cooldown: 12
you_decide: true
default_option: not_yet
patience: 0
options:
  - id: retire
    label: Tell the Don you would like to retire
    outcomes:
      - tone: neutral
        text: The Don is quiet for a long time. Then he pours two glasses of something old and tells you it was an honor.
        effects:
          - flag: retire
  - id: not_yet
    label: Not yet
    outcomes:
      - tone: neutral
        text: You put the brochures in a drawer. Your wife finds them there, and leaves them on the table again.
