id: orphanage
title: "{capo}'s orphanage"
text: |-
  {capo} wants the family to pay for a new wing on the orphanage run by the Sisters of Mercy. Ten thousand dollars. He grew up there.

  He has already told the Mother Superior that it is done.
cast:
  capo:
    role: [capo]
    where: [{any: [[self, has, pious], [self, has, sentimental]]}]
trigger: [[treasury, ">", 20000]]
cooldown: 36
options:
  - id: pay
    label: Pay for the wing
    don: {base: 0.5, pious: 1, sentimental: 1}
    outcomes:
      - tone: good
        text: The wing opens with a plaque that names nobody. {capo} cries at the ceremony and will not discuss it.
        headline: "Anonymous Gift Builds New Wing at Orphanage"
        effects:
          - treasury: -10000
          - stat: {who: capo, stat: loyalty, delta: 10}
          - standing: {influence: 3}
  - id: half
    label: Pay half, and let {capo} find the rest
    don: {base: 0.5, cautious: 0.5}
    outcomes:
      - tone: neutral
        text: "{capo} finds the rest. Some of it comes from places a Mother Superior would rather not know about."
        effects:
          - treasury: -5000
          - stat: {who: capo, stat: greed, delta: 3}
  - id: decline_it
    label: The family cannot pay for every good cause
    don: {base: 0, cautious: 0.5}
    outcomes:
      - tone: bad
        text: "{capo} has to tell the Mother Superior. It is the hardest thing he has done in years, and he does not forget who made him do it."
        effects:
          - stat: {who: capo, stat: loyalty, delta: -10}
          - memory: {who: capo, about: don, weight: -10, decay: 0.01}
