title: "{capo}"
headline: "Body Found in Car on Side Street"
text: |-
  {capo} was found on Sunday morning in his car, on a side street nobody uses. The war with {rival} has a price, and this month it was him.

  The Don paid for the funeral. Half the city came, and the other half sent flowers and watched from across the street.
