id: empty_chair_ambition
title: "{capo} wants the underboss's chair"
text: |-
  The family has no underboss. {capo} has noticed, and he has noticed that nobody else has asked.

  He would like to be asked.
cast:
  capo:
    role: [capo]
    where: [[self, has, ambitious], [self.loyalty, ">=", 50]]
trigger: [[crew_size, ">=", 2]]
cooldown: 24
options:
  - id: make
    label: Make him underboss
    don: {base: 0, vain: 0.5, sentimental: 0.5}
    outcomes:
      - tone: good
        text: "{capo} becomes underboss at a dinner where everyone stands. His rackets are handed to others, which he minds less than he expected."
        effects:
          - promote: {who: capo, role: underboss}
          - stat: {who: capo, stat: loyalty, delta: 10}
          - stat: {who: crew, stat: loyalty, delta: -2}
  - id: wait_on_it
    label: Tell him the Don is still thinking
    don: {base: 0.5, cautious: 1}
    outcomes:
      - tone: neutral
        text: "{capo} waits. Ambitious men are not good at waiting."
        effects:
          - stat: {who: capo, stat: loyalty, delta: -5}
