id: investigation_pressure
title: The government and {target}
text: |-
  The federal people are still watching {target}. A man from the telephone company was up the pole outside his house on Tuesday, and the telephone company says it sent nobody.
cast:
  target:
    investigated: true
    role: [capo, underboss]
    where: [[self.investigation, "<=", 2]]
weight: 2
cooldown: 4
options:
  - id: step_back
    label: Take his rackets from him until it cools
    don: {base: 0, cautious: 1}
    outcomes:
      - tone: neutral
        text: "{target} hands over his rackets with a face like a closed door. Without them he is just a man who goes to the club."
        effects:
          - unassign: target
          - stat: {who: target, stat: loyalty, delta: -6}
          - memory: {who: target, about: don, weight: -6}
  - id: lawyers
    label: Put Mr. Fessler on it
    don: {base: 0.5}
    outcomes:
      - weight: 2
        tone: good
        text: Mr. Fessler files motions the government has to answer. Answering takes the government most of the season.
        effects:
          - treasury: -4000
          - investigation: {who: target, progress: -35}
      - weight: 1
        tone: neutral
        text: Mr. Fessler files motions. The government answers them all, promptly and politely.
        effects:
          - treasury: -4000
  - id: bribe
    label: Find out who at the Bureau has a mortgage
    don: {base: 0, paranoid: 0.5}
    advised_exposure: 4
    outcomes:
      - weight: 2
        tone: good
        text: A file goes missing from a cabinet that is supposed to be locked. Nobody is sure where it went, and nobody looks very hard.
        effects:
          - treasury: -7000
          - investigation: {who: target, progress: -70}
      - weight: 1
        tone: bad
        text: The man with the mortgage was being watched too. Now there is a second file, and your name is in it.
        effects:
          - treasury: -7000
          - standing: {exposure: 6}
