id: shopkeepers_son
title: The druggist's boy
text: |-
  One of {capo}'s men put the druggist's son in the hospital over a late payment. The boy is seventeen.

  His father has been seen talking to a man from the Herald.
cast:
  capo:
    role: [capo]
    where: [[self, has, hothead]]
cooldown: 12
options:
  - id: pay
    label: Pay the hospital, and something extra
    don: {base: 0.5, sentimental: 1}
    outcomes:
      - weight: 3
        tone: good
        text: The family pays the bills and sends a priest. The druggist stops returning the reporter's calls.
        effects:
          - treasury: -3000
          - standing: {exposure: -1}
      - weight: 1
        tone: bad
        text: The family pays, and the druggist talks anyway. A short item runs on page eleven. Nobody is named yet.
        effects:
          - treasury: -3000
          - standing: {exposure: 3}
          - don_mood: -3
  - id: discipline
    label: Make {capo} discipline his man
    don: {base: 0, cautious: 1}
    outcomes:
      - weight: 2
        tone: good
        text: "{capo}'s man is sent to work the docks upstate for a year. {capo} understands that the message was also for him."
        effects:
          - stat: {who: capo, stat: discretion, delta: 5}
          - stat: {who: capo, stat: loyalty, delta: -3}
      - weight: 1
        tone: bad
        text: "{capo} refuses to punish one of his own for doing his job. He says so in front of people."
        effects:
          - stat: {who: capo, stat: loyalty, delta: -6}
          - memory: {who: capo, about: don, weight: -6}
          - cohesion: -2
  - id: ignore
    label: Leave it to {capo}
    don: {base: 0}
    outcomes:
      - weight: 1
        tone: bad
        text: The Herald runs the story with a photograph of the boy. The precinct captain asks for a larger envelope this month.
        effects:
          - standing: {exposure: 4}
          - treasury: -2000
          - don_mood: -4
      - weight: 1
        tone: neutral
        text: The story never runs. Every shop on the avenue pays on time this month.
        effects:
          - stat: {who: capo, stat: fear, delta: 3}
