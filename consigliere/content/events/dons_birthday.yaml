id: dons_birthday
title: The Don's birthday
text: |-
  The Don will be seventy, or near enough, and he wants a party. A real one: three hundred guests, an orchestra, the whole of the ballroom at the Hotel Regina.

  Every family in the city will be invited. So will the attention.
trigger: [[month, ">=", 36]]
cooldown: 48
options:
  - id: lavish
    label: Give him the party he wants
    don: {base: 0.5, sentimental: 1.5, vain: 1}
    outcomes:
      - tone: good
        text: The party is magnificent. The Don dances with his granddaughter and tells you, with tears in his eyes, that he is a lucky man.
        headline: "Three Hundred Fete Businessman at Hotel Regina"
        effects:
          - treasury: -8000
          - don_mood: 12
          - heat: {who: family, delta: 4}
  - id: modest
    label: Something smaller, at the house
    don: {base: 0, cautious: 1.5}
    outcomes:
      - tone: neutral
        text: Forty guests, the Don's own wine, and an accordion. He says it is better this way, and means it more than he expected.
        effects:
          - treasury: -2000
          - don_mood: 4
