# Tuning numbers. Change these freely; no code changes needed.

economy:
  income_variance: 0.2        # a racket's month swings up to ±20% around its typical income
  competence_floor: 0.7       # income x0.7 at competence 0, x1.3 at competence 100
  capo_share: 0.5             # the capo keeps half for himself and his crew; the rest goes up
  max_skim: 0.4               # nobody dares hold back more than 40% of what he owes
  skim_trait_bonus:           # added to skim tendency (0..1), which is greed x disloyalty
    greedy: 0.15
    ambitious: 0.05
    loyal: -0.08
    pious: -0.05
  skim_noise: 0.5             # skim fraction varies ±50% month to month

loyalty:
  base: 50
  don_respect_weight: 0.4     # each point of the Don's respect above 50 adds 0.4 to a man's target
  cohesion_weight: 0.3
  trait_targets:
    loyal: 20
    sentimental: 5
    pious: 5
    ambitious: -10
    greedy: -5
    hothead: -5
    paranoid: -5
  memory_cap: 20              # remembered favors and slights move the target by at most ±20
  drift_rate: 0.1             # loyalty closes 10% of the gap to its target each month
  noise: 2.0                  # plus or minus up to 2 points of plain human weather
  cohesion_drift_rate: 0.1
  forget_below: 0.5           # memories weaker than this are forgotten

stipends:
  missed_memory_weight: -8    # a missed stipend is remembered as a slight against the family
  missed_decay_rate: 0.03

observation:
  base_notice: 0.35           # chance you notice a man's shift in a given month...
  indiscretion_weight: 0.5    # ...plus up to 50% more if he has no discretion at all
  confidence: 0.6

matters:
  per_month_min: 1            # matters that reach your desk each month
  per_month_max: 3

advice:
  follow_base: 0.15           # chance the Don takes your advice...
  follow_trust_weight: 0.7    # ...plus up to 70% more at Don's Trust 100
  follow_mood_weight: 0.1     # ...plus or minus up to 10% for his mood
  follow_traits:
    paranoid: -0.10
    vain: -0.05
    sentimental: 0.05
  follow_min: 0.05
  follow_max: 0.95
  don_noise: 1.0              # how much his own preference wavers
  trust:                      # Don's Trust change after a matter is settled
    followed_good: 3
    followed_bad: -8          # a bad call he follows costs more
    followed_neutral: 0
    ignored_good: -2          # he went his own way and it worked: you were wrong
    ignored_bad: -2           # a good call he ignores still costs you when it goes wrong
    ignored_neutral: 0
  silence_penalty: 1          # a month in which you advised on none of the Don's matters costs this much trust...
  silence_floor: 25           # ...but silence alone only sidelines you; it never takes trust below this

mood:                         # the Don's mood after a matter turns out...
  good: 3
  bad: -5
  neutral: 0
  drift_rate: 0.1             # ...and how fast it returns to even

information:
  verify_cost: 3              # Influence spent to hear from a second source
  prior_weight: 4             # your first impression of a source counts as this many reports
  reveal_chance: 0.6          # chance the truth comes out after a matter is settled
  monthly_influence: 1        # favors owed to you accrue slowly, month by month

heat:
  racket_decay: 0.08          # a racket sheds 8% of its heat a month; it settles near heat_per_month / 0.08
  family_follow: 0.2          # family heat closes 20% of the gap to its rackets' average each month
  war_heat: 4                 # every family's heat rises this much each month a war goes on

law:
  open_threshold: 45          # a person's heat above this can draw an investigation...
  open_scale: 200             # ...with chance (heat - threshold) / scale a month...
  open_max: 0.15              # ...up to this
  base_progress: 2            # an investigation advances this much a month...
  pressure_divisor: 6         # ...plus his heat divided by this...
  decay: 6                    # ...minus this; below zero it loses ground, and at surveillance it closes
  rat_bonus: 6                # extra progress a month while a rat is talking
  turned_relief: 3            # less progress a month while the government is fed lies
  learn_base: 0.15            # chance a month you hear of an investigation you didn't know about...
  learn_police: 0.5           # ...plus this with an honest police source
  family_support: 500         # monthly stipend owed to the family of a jailed man

rivals:
  aggression: {hothead: 3, ambitious: 2, greedy: 1, cautious: -2, pious: -1}
  aggression_weight: 0.5      # tension a month per point of the rival boss's aggression
  strength_divisor: 20        # plus (their strength - ours) / this
  noise: 2.0
  calm_rate: 0.05             # tension sheds 5% a month on its own
  base_strength: 55           # strength recovers toward this in peacetime...
  regen_rate: 0.05            # ...closing 5% of the gap a month
  war_cost: 3000              # a month of war costs the family this much
  war_loss_min: 1             # strength each side loses in a month of war
  war_loss_max: 3
  war_end_strength: 15        # a side this weak has lost the war

sitdown:
  max_rounds: 5
  concession: 300             # each offer raises your tribute offer by this much a month
  ask_drop: 200               # they come down this much when you concede...
  hold_drop: 100              # ...or this much when you hold firm, if they need the peace
  threat_drop: 400            # a credible threat brings their ask down this far
  threat_margin: 10           # your strength must exceed theirs by this for a threat to be credible
  red_line_min: 400           # the lowest tribute they would ever accept falls in this range...
  red_line_max: 1400
  stronger_premium: 500       # ...plus this if they are stronger than you...
  broke_discount: 400         # ...minus this if their treasury is low
  broke_treasury: 20000
  opening_margin_min: 800     # they open this far above their red line
  opening_margin_max: 1400
  patience: 3
  good_deal_margin: 400       # a deal within this of their red line pleases the Don
  tribute_months: 24          # how long an agreed tribute is owed

life:
  age_threshold: 50           # past this age, health starts to slip...
  age_rate: 0.015             # ...a monthly chance of 1.5% per year over it
  don_factor: 1.5             # Dons carry more on their hearts
  vice_rate: {drink: 0.05}
  decline_min: 1
  decline_max: 3
  spell_below: 35             # a man this frail can have a spell...
  spell_chance: 0.08
  spell_min: 5
  spell_max: 15

succession:
  backing_bonus: 20           # your backing adds this to a candidate's weight...
  influence_weight: 0.5       # ...plus half your Influence
  keep_base: 0.3              # a new Don you opposed keeps you with this chance...
  keep_influence: 0.005       # ...plus this per point of Influence
  trust_backed_winner: 70
  trust_neutral: 45
  trust_backed_loser: 25

endings:
  last_month: 179             # December 1972
  ruin_strength: 5
  ruin_treasury: -25000
  exile_exposure: 100
  intact_strength: 45         # "the family intact": at least this strong...
  intact_treasury: 25000      # ...with this much put away
