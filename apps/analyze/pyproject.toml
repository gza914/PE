[project]
name = "doomwire-analyze"
version = "0.1.0"
description = "LLM analysis pipelines — narrative detection and monitoring"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "mypy>=1.13.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
